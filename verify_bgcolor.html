<script>
function assert(cond, msg){ if(!cond) throw new Error(msg); }
function rgbArr(str){ var m = /rgb\((\d+),(\d+),(\d+)\)/.exec(str); return m ? [+m[1],+m[2],+m[3]] : null; }
function dist(a,b){ return Math.sqrt(Math.pow(a[0]-b[0],2)+Math.pow(a[1]-b[1],2)+Math.pow(a[2]-b[2],2)); }
$(function(){
  try {
    var s = Object.create( EditorScreen.prototype );

    var changed = ["red","brown","green","darkgreen","blue","darkblue","purple"];

    // (1) 線色・文字色（通常パレット）は従来の鮮やかな色のまま
    assert( s._colorNameToRgb("red") === "rgb(220,0,0)", "line/text red unchanged: " + s._colorNameToRgb("red") );
    assert( s._colorNameToRgb("blue") === "rgb(0,0,220)", "line/text blue unchanged" );

    // (2) 背景色は7色が明るく変更され、かつ従来の鮮やかな色と異なる
    for ( var i=0; i<changed.length; i++ ) {
      var name = changed[i];
      var bg = rgbArr( s._backgroundColorNameToRgb( name ) );
      var vivid = rgbArr( s._colorNameToRgb( name ) );
      assert( bg, "bg " + name + " resolves" );
      // 明るい（黒文字が読める）: 各チャンネルが十分高い
      assert( Math.min(bg[0],bg[1],bg[2]) >= 160, name + " bg not light enough: " + bg.join(",") );
      // 従来色と異なる
      assert( dist(bg, vivid) > 60, name + " bg not distinct from vivid" );
    }

    // (3) 変更しない背景色は従来通り
    assert( s._backgroundColorNameToRgb("pink") === "rgb(255,120,120)", "bg pink unchanged" );
    assert( s._backgroundColorNameToRgb("white") === "rgb(255,255,255)", "bg white unchanged" );
    assert( s._backgroundColorNameToRgb("gray") === "rgb(130,130,130)", "bg gray unchanged" );
    assert( s._backgroundColorNameToRgb("transparent") === null, "bg transparent null" );

    // (4) 差別化: 7背景色＋既存の明るい背景色が互いに十分区別できる（近い代表ペアを重点検査）
    var bgOf = function(n){ return rgbArr( s._backgroundColorNameToRgb(n) ); };
    var pairs = [
      ["red","pink"], ["green","lightgreen"], ["green","darkgreen"],
      ["blue","skyblue"], ["blue","darkblue"], ["darkblue","purple"],
      ["darkgreen","green"], ["brown","yellow"]
    ];
    for ( var p=0; p<pairs.length; p++ ) {
      var d = dist( bgOf(pairs[p][0]), bgOf(pairs[p][1]) );
      assert( d >= 25, "bg " + pairs[p][0] + " vs " + pairs[p][1] + " too close (dist " + d.toFixed(1) + ")" );
    }
    // 全ペア完全一致が無いこと
    var names = changed.concat(["pink","lightgreen","skyblue","yellow","gray","white"]);
    for ( var a=0; a<names.length; a++ ) for ( var b=a+1; b<names.length; b++ ) {
      assert( dist( bgOf(names[a]), bgOf(names[b]) ) > 0.5, "bg " + names[a] + " equals " + names[b] );
    }

    // (5) 実描画: backgroundColor="red" のボックスの塗りが明るい赤(~255,205,205)であること
    s.zoom_rate = 1; s.inputting_uml_object = null; s.inputting_uml_object_shape = null;
    var box = {
      id:"t", type:"text_box", x:0, y:0, width:100, height:60,
      inner_rects:{ name:{ id:"name", type:"rect", x:0,y:0,width:100,height:60, has_text:false, text:"", is_border_visible:true, fill:true } },
      inner_lines:[], inner_shapes:{}, children:{},
      params:{ lineColor:"red", backgroundColor:"red", lineWidth:6 }
    };
    var c = document.createElement("canvas"); c.width=200; c.height=200;
    var ctx = c.getContext("2d");
    s._drawUmlObjectAt( ctx, 0, 0, box, null, null );
    var f = ctx.getImageData(50, 30, 1, 1).data;
    var expected = rgbArr( s._backgroundColorNameToRgb("red") );
    assert( Math.abs(f[0]-expected[0])<=6 && Math.abs(f[1]-expected[1])<=6 && Math.abs(f[2]-expected[2])<=6,
      "fill should be light red " + expected.join(",") + " but got " + f[0]+","+f[1]+","+f[2] );
    // 塗りが従来の鮮やかな赤(220,0,0)ではないこと
    assert( ! (f[0]===220 && f[1]===0 && f[2]===0), "fill must not be vivid red" );
    // 枠線（左辺・線幅6px内をサンプル）は鮮やかな赤のまま
    var e = ctx.getImageData(2, 30, 1, 1).data;
    assert( e[0] > 180 && e[1] < 80 && e[2] < 80, "border stays vivid red, got " + e[0]+","+e[1]+","+e[2] );

    document.title = "TEST_RESULT:PASS";
  } catch(err) {
    document.title = "TEST_RESULT:FAIL: " + err.message;
  }
});
