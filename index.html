<script type="text/javascript">
$(function(){

    // HTML文書（タイトル・lang属性）に表示言語を反映する

    var canvas_element = $("#fix-screen-size");
    var canvas_if = new Application();
    new HTML5CanvasFactory().create( $(canvas_element.get(0)), canvas_if );

} );
